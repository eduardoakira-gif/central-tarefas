# Atualiza o servidor (Supabase) sozinho sempre que algo em backend/ muda no GitHub.
# Faz duas coisas: aplica o schema.sql (só cria o que falta, nunca apaga dados)
# e publica a função "api" com Verify JWT desligado.
#
# Precisa de UM segredo em Settings > Secrets and variables > Actions:
#   SUPABASE_ACCESS_TOKEN  (supabase.com > Account > Access Tokens > Generate new token)
# O código do projeto é lido de js/config.js.

name: Atualizar servidor

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-backend.yml"]
  # também roda sozinho a cada 2 horas: assim que o token for cadastrado,
  # o servidor se atualiza sem precisar de nenhuma ação
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

concurrency: deploy-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir configuração
        id: check
        run: |
          # na rodada agendada, só publica se o servidor ainda não estiver na versão do código
          WANT=$(grep -oE 'const SERVER_VERSION = [0-9]+' backend/supabase/functions/api/index.ts | grep -oE '[0-9]+$')
          WANTB=$(grep -oE 'const SERVER_BUILD = "[^"]+"' backend/supabase/functions/api/index.ts | cut -d'"' -f2)
          REF=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' js/config.js | head -1 | sed -E 's#https://([a-z0-9]+)\.supabase\.co#\1#')
          echo "REF=$REF" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$REF" ]; then
            HAVE=$(curl -s -X POST "https://$REF.supabase.co/functions/v1/api" -H "content-type: application/json" -d '{"action":"config"}' | jq -r '.build // ""' 2>/dev/null)
            if [ "$HAVE" = "$WANTB" ]; then echo "Servidor já atualizado ($HAVE)."; echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF" ]; then
            echo "::warning::Falta o segredo SUPABASE_ACCESS_TOKEN (ou o projeto em js/config.js). O servidor não foi atualizado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Atualizar tabelas (schema.sql)
        if: steps.check.outputs.ok == 'true'
        run: |
          jq -Rs '{query: .}' backend/supabase/schema.sql > /tmp/query.json
          curl -fsS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "content-type: application/json" \
            --data @/tmp/query.json > /dev/null
          echo "Tabelas atualizadas."

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ok == 'true'
        with:
          version: latest

      - name: Publicar função api
        if: steps.check.outputs.ok == 'true'
        working-directory: backend
        run: supabase functions deploy api --project-ref "$REF" --no-verify-jwt

      - name: Conferir servidor
        if: steps.check.outputs.ok == 'true'
        run: |
          sleep 5
          curl -fsS -X POST "https://$REF.supabase.co/functions/v1/api" -H "content-type: application/json" -d '{"action":"config"}'
